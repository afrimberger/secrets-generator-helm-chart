apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-generate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: secrets-generator
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    #argocd.argoproj.io/sync-wave: "-1"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-generator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: OnFailure
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: inner-chart
          configMap:
            name: {{ .Release.Name }}-inner-chart
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 128Mi
              cpu: 1
            requests:
              memory: 128Mi
              cpu: 100m
          volumeMounts:
            - name: inner-chart
              mountPath: /chart-data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077

              cleanup() {
                rm -rf /tmp/inner-chart /tmp/rendered.yaml /tmp/secrets
              }
              trap cleanup EXIT

              mkdir -p /tmp/inner-chart/templates
              cp /chart-data/Chart.yaml /tmp/inner-chart/Chart.yaml
              cp /chart-data/secrets.yaml /tmp/inner-chart/templates/secrets.yaml

              echo "Executing helm template for rendering secrets"
              if ! helm template inner /tmp/inner-chart > /tmp/rendered.yaml; then
                echo "ERROR: helm template failed"
                exit 1
              fi
              echo "successfully rendered templates"

              NAMESPACE="{{ .Release.Namespace }}"

              mkdir -p /tmp/secrets
              awk 'BEGIN{n=0} /^---/{n++; next} {print > "/tmp/secrets/doc-"n".yaml"}' /tmp/rendered.yaml

              for file in /tmp/secrets/doc-*.yaml; do
                [ -s "$file" ] || continue

                SECRET_NAME=$(awk '/^metadata:/{found=1; next} found && /^  name:/{gsub(/"/, "", $2); print $2; exit}' "$file")
                [ -z "$SECRET_NAME" ] && continue

                if ! printf '%s' "$SECRET_NAME" | grep -qE '^[a-z0-9][a-z0-9.\-]*[a-z0-9]$'; then
                  echo "ERROR: invalid secret name: $SECRET_NAME"
                  exit 1
                fi

                # Distinguish "not found" from other errors to avoid overwriting existing secrets
                GET_RESULT=$(kubectl get secret -n "$NAMESPACE" -o go-template='{{ "{{" }}.metadata.name{{ "}}" }}' -- "$SECRET_NAME" 2>&1) && SECRET_EXISTS=true || SECRET_EXISTS=false

                echo -e "\n----- Processing secret: $SECRET_NAME"

                if [ "$SECRET_EXISTS" = "false" ]; then
                  if echo "$GET_RESULT" | grep -q "NotFound"; then
                    echo "does not exist, creating"
                    kubectl create -f "$file" -n "$NAMESPACE"
                  else
                    echo "ERROR: failed to check secret $SECRET_NAME: $GET_RESULT"
                    exit 1
                  fi
                else
                  EXISTING_KEYS=$(kubectl get secret -n "$NAMESPACE" -o go-template='{{ "{{" }}range $k,$v := .data{{ "}}" }}{{ "{{" }}$k{{ "}}" }}{{ "{{" }}"\n"{{ "}}" }}{{ "{{" }}end{{ "}}" }}' -- "$SECRET_NAME")

                  DESIRED_KEYS=$(awk '/^data:/{found=1; next} found && /^[^ ]/{exit} found && /^  [^ ]+:/{gsub(/:.*/, "", $1); print $1}' "$file")

                  NEEDS_PATCH=false
                  PATCH_DATA=""

                  for key in $DESIRED_KEYS; do
                    if ! printf '%s' "$key" | grep -qE '^[a-zA-Z0-9_.\-]+$'; then
                      echo "ERROR: invalid key name: $key"
                      exit 1
                    fi

                    if ! echo "$EXISTING_KEYS" | grep -qx "$key"; then
                      echo "Key missing: $key — will add"
                      VALUE=$(awk -v k="$key" '
                        $0 ~ "^  "k": " {
                          sub("^  "k": *", "")
                          print
                          exit
                        }
                      ' "$file")

                      if ! printf '%s' "$VALUE" | grep -qE '^[A-Za-z0-9+/=]+$'; then
                        echo "ERROR: value for key $key is not valid base64"
                        exit 1
                      fi

                      if [ -z "$PATCH_DATA" ]; then
                        PATCH_DATA="\"$key\":\"$VALUE\""
                      else
                        PATCH_DATA="$PATCH_DATA,\"$key\":\"$VALUE\""
                      fi
                      NEEDS_PATCH=true
                    fi
                  done

                  if [ "$NEEDS_PATCH" = "true" ]; then
                    kubectl patch secret -n "$NAMESPACE" --type=merge -p "{\"data\":{$PATCH_DATA}}" -- "$SECRET_NAME"
                    echo "patched with missing keys"
                  else
                    echo "exists, all keys present — no action needed"
                  fi
                fi
              done

              echo -e "\nSecret generation complete."
